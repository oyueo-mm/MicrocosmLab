name: Audit playable video metadata and thumbnails
on:
  pull_request:
    paths:
      - 'scripts/audit-playback.mjs'
      - '.github/workflows/playback-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 5'
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source video derivatives and thumbnail metadata (non-gating)
        run: node scripts/audit-playback.mjs --limit=72 --probe=12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-and-thumbnail-audit
          path: artifacts/playback-availability-report.json
          if-no-files-found: ignore
