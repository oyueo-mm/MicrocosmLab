name: Deploy MicrocosmLab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project documentation
        run: node scripts/test-docs.mjs
      - name: Verify catalog metadata normalization
        run: node scripts/test-catalog-cleanup.mjs
      - name: Verify source clip grouping
        run: node scripts/test-grouping.mjs
      - name: Verify batch collection safeguards
        run: node scripts/test-batch-pipeline.mjs
      - name: Validate approved content
        run: node scripts/validate-content.mjs
      - name: Check recommendation ranking
        run: node scripts/test-recommendations.mjs
      - name: Evaluate recommendation V3
        run: node scripts/test-recommendation-v3.mjs
      - name: Compare recommendation V4 research candidates
        run: node scripts/test-recommendation-lab.mjs
      - name: Verify discovery and blind human-judgment pool
        run: node scripts/test-recommendation-discovery.mjs
      - name: Verify optional collaborative and bandit prototypes
        run: node scripts/test-online-research-prototypes.mjs
      - name: Check discovery filters
        run: node scripts/test-explorer.mjs
      - name: Check Korean video titles, page jumps and shorts feed
        run: node scripts/test-korean-and-shorts.mjs
      - name: Check subject grouping
        run: node scripts/test-subjects.mjs
      - name: Report catalog review quality
        run: node scripts/quality-report.mjs
      - name: Verify quality report dimensions
        run: node scripts/test-quality-report.mjs
      - name: Build for project Pages URL
        run: npm run build -- --base=/MicrocosmLab/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
