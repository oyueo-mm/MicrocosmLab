name: Bulk import microscopy videos
on:
  push:
    branches: [main]
    paths:
      - scripts/bulk-import.mjs
      - .github/workflows/bulk-import.yml
permissions:
  contents: write
jobs:
  bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/bulk-import.mjs
      - run: node scripts/validate-content.mjs
      - name: Validate original media and license metadata
        run: node scripts/audit-commons.mjs --strict
      - name: Publish verified metadata catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/organisms.json
          if ! git diff --cached --quiet; then git commit -m "feat: bulk import verified microscopy media metadata"; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-import-report
          path: artifacts/bulk-import-report.json